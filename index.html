<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研分数拆解工具</title>
<style>
  :root{
    --ink:#1b2030;
    --muted:#6c7488;
    --line:#e6e9f2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#f3f5fb;
    background-image:radial-gradient(900px 400px at 15% -10%, #e6e9ff 0%, transparent 60%),
                     radial-gradient(700px 400px at 95% 0%, #f0e8ff 0%, transparent 55%);
    color:var(--ink);
    min-height:100vh;
    padding:22px 16px 36px;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:820px;margin:0 auto;}

  /* ---------- 顶部标题 ---------- */
  .hero{text-align:center;margin-bottom:16px;}
  .hero h1{
    margin:0 0 5px;
    font-size:21px;
    letter-spacing:.4px;
    background:linear-gradient(120deg,#4f46e5,#8b5cf6 60%,#d946ef);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .hero p{margin:0;color:var(--muted);font-size:12px;}

  /* ---------- 控制面板 ---------- */
  .panel{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:13px 15px;
    display:flex;
    gap:12px;
    align-items:flex-end;
    flex-wrap:wrap;
    box-shadow:0 5px 22px rgba(30,40,90,.06);
  }
  .field{display:flex;flex-direction:column;gap:5px;}
  .field-label-row{
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;flex-wrap:nowrap;
  }
  .field label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.3px;white-space:nowrap;}
  .field input{
    height:36px;
    border-radius:9px;
    border:1.5px solid #e2e6f0;
    padding:0 11px;
    font-size:14px;
    font-family:inherit;
    background:#fafbff;
    color:var(--ink);
    outline:none;
    transition:.18s;
  }
  .field input{width:100px;font-weight:700;font-variant-numeric:tabular-nums;}
  .field input:focus{
    border-color:#8b8bf0;background:#fff;
    box-shadow:0 0 0 3px rgba(99,102,241,.12);
  }
  .quick-chips{display:flex;gap:4px;flex:none;}
  .chip{
    border:1px solid #e0e2f5;
    background:#f6f7ff;
    color:#6366f1;
    font-size:10.5px;
    font-weight:700;
    font-family:inherit;
    padding:2px 7px;
    border-radius:99px;
    cursor:pointer;
    transition:.15s;
    line-height:1.3;
  }
  .chip:hover{background:#eef0ff;border-color:#c7cdf5;}
  .chip.active{
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:#fff;border-color:transparent;
    box-shadow:0 2px 6px rgba(99,102,241,.3);
  }
  .btn{
    height:36px;padding:0 16px;border-radius:9px;border:none;
    font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;
    transition:.18s;white-space:nowrap;
  }
  .btn-primary{
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:#fff;
    box-shadow:0 5px 14px rgba(99,102,241,.3);
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(99,102,241,.4);}
  .btn-primary:active{transform:translateY(0);}
  .btn-ghost{
    background:#f3f4fb;color:#5b5bd6;border:1.5px solid #e0e2f5;
  }
  .btn-ghost:hover{background:#eaecfa;}
  .btn-export{
    background:#fff;color:#4f46e5;border:1.5px solid #c7d2fe;
  }
  .btn-export:hover{background:#f6f7ff;border-color:#a5b4fc;}

  /* ---------- 自定义下拉框 ---------- */
  .dropdown{position:relative;min-width:240px;}
  .dropdown-trigger{
    width:100%;height:36px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:0 11px;
    border-radius:9px;
    border:1.5px solid #e2e6f0;
    background:#fafbff;
    color:var(--ink);
    font-size:12.5px;font-family:inherit;font-weight:600;
    cursor:pointer;
    transition:.18s;
    text-align:left;
    outline:none;
  }
  .dropdown-trigger:hover{border-color:#c7cdf5;background:#fff;}
  .dropdown.open .dropdown-trigger,
  .dropdown-trigger:focus-visible{
    border-color:#8b8bf0;background:#fff;
    box-shadow:0 0 0 3px rgba(99,102,241,.12);
  }
  .dropdown-trigger > span{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .dropdown-arrow{
    width:12px;height:12px;flex:none;color:#8b8bf0;
    transition:transform .22s cubic-bezier(.4,0,.2,1);
  }
  .dropdown.open .dropdown-arrow{transform:rotate(180deg);}
  .dropdown-menu{
    position:absolute;z-index:60;top:calc(100% + 6px);left:0;right:0;
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:5px;
    box-shadow:0 16px 38px rgba(30,40,90,.18);
    opacity:0;transform:translateY(-5px) scale(.98);
    pointer-events:none;
    transition:.18s cubic-bezier(.4,0,.2,1);
    max-height:280px;overflow:auto;
    transform-origin:top center;
  }
  .dropdown.open .dropdown-menu{
    opacity:1;transform:translateY(0) scale(1);pointer-events:auto;
  }
  .dropdown-option{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;
    border-radius:8px;
    font-size:12.5px;
    color:#3a4257;
    cursor:pointer;
    transition:.15s;
    line-height:1.4;
    outline:none;
  }
  .dropdown-option:hover,
  .dropdown-option:focus-visible{background:#f2f3ff;color:#4f46e5;}
  .dropdown-option.active{
    background:linear-gradient(135deg,#eef0ff,#f6eeff);
    color:#4f46e5;font-weight:700;
  }
  .dropdown-option .dot{
    width:6px;height:6px;border-radius:50%;background:#c7cdf5;flex:none;
    transition:.15s;
  }
  .dropdown-option.active .dot{
    background:#6366f1;
    box-shadow:0 0 0 2.5px rgba(99,102,241,.18);
  }

  /* ---------- 汇总条 ---------- */
  .summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
  }
  .sum-block{
    position:relative;
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 15px 11px 17px;
    box-shadow:0 3px 14px rgba(30,40,90,.05);
    overflow:hidden;
  }
  .sum-block.total{overflow:visible;}
  .sum-block::before{
    content:"";
    position:absolute;left:0;top:11px;bottom:11px;width:3.5px;
    border-radius:0 3px 3px 0;
  }
  .sum-block.total::before{background:linear-gradient(180deg,#818cf8,#6366f1);}
  .sum-block.rate::before{background:linear-gradient(180deg,#34d399,#0ea5a5);}
  .sum-label{
    font-size:11px;color:var(--muted);font-weight:600;
    letter-spacing:.3px;margin-bottom:3px;
  }
  .sum-val{
    font-size:21px;font-weight:800;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.4px;line-height:1.1;
  }
  .sum-block.total .sum-val{color:#4f46e5;}
  .sum-block.rate .sum-val{color:#0ea5a5;}

  /* ---------- 目标总分小标签提示 ---------- */
  .total-tip{
    position:absolute;
    top:-11px;
    right:10px;
    padding:3px 10px;
    border-radius:99px;
    background:#fff7ed;
    border:1px solid #fdba74;
    color:#c2410c;
    font-size:10.5px;
    font-weight:700;
    line-height:1.35;
    white-space:nowrap;
    opacity:0;
    transform:translateY(5px) scale(.96);
    transition:opacity .22s ease, transform .22s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
    box-shadow:0 4px 12px rgba(194,65,12,.16);
    z-index:8;
  }
  .total-tip.show{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  /* ---------- 偏差提示条 ---------- */
  .diff-bar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:10px;
    padding:8px 14px;
    border-radius:11px;
    font-size:12px;font-weight:600;
    border:1.5px solid;
    transition:.2s;
  }
  .diff-bar[hidden]{display:none;}
  .diff-bar.over{background:#fff8f0;border-color:#fcd34d;color:#b45309;}
  .diff-bar.under{background:#f0f7ff;border-color:#93c5fd;color:#1d4ed8;}
  .diff-fix{
    flex:none;
    padding:5px 14px;border-radius:8px;border:none;
    font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;
    background:#fff;color:inherit;
    box-shadow:0 1px 4px rgba(0,0,0,.09);
    transition:.15s;
  }
  .diff-fix:hover{transform:translateY(-1px);box-shadow:0 3px 9px rgba(0,0,0,.14);}

  /* ---------- 科目卡片 ---------- */
  .subjects{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:10px;
    margin-top:12px;
  }
  .subjects.cols-2{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .card{
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:13px;
    padding:12px 14px 11px;
    box-shadow:0 3px 14px rgba(30,40,90,.05);
    transition:border-color .2s, box-shadow .2s, transform .2s;
  }
  .card:hover{transform:translateY(-1.5px);box-shadow:0 8px 22px rgba(30,40,90,.09);}
  .card.locked{
    border-color:#c7d2fe;
    background:linear-gradient(180deg,#fdfdff,#f6f7ff);
    box-shadow:0 5px 18px rgba(99,102,241,.13);
  }
  .card-top{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:9px;gap:8px;
  }
  .card-name{
    flex:1;min-width:0;
    font-size:13.5px;font-weight:700;letter-spacing:.1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    cursor:text;
    border-radius:4px;
    transition:background .15s;
  }
  .card-name:hover{background:#f2f3ff;}
  .card-full{flex:none;font-size:11px;color:var(--muted);font-weight:600;}
  .rename-input{
    flex:1;min-width:0;
    height:24px;
    border:1.5px solid #8b8bf0;
    border-radius:6px;
    background:#fff;
    font-size:13px;font-weight:700;
    font-family:inherit;
    color:#4f46e5;
    padding:0 7px;
    outline:none;
    box-shadow:0 0 0 3px rgba(99,102,241,.12);
  }
  .card-mid{display:flex;align-items:center;gap:7px;}
  .score-input{
    width:74px;height:38px;
    border-radius:9px;
    border:1.5px solid #e2e6f0;
    background:#fafbff;
    font-size:20px;font-weight:800;
    text-align:center;
    color:#4f46e5;
    font-family:inherit;
    font-variant-numeric:tabular-nums;
    outline:none;
    transition:.18s;
    -moz-appearance:textfield;
  }
  .score-input::-webkit-outer-spin-button,
  .score-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .score-input:focus{
    border-color:#8b8bf0;background:#fff;
    box-shadow:0 0 0 3px rgba(99,102,241,.12);
  }
  .unit{font-size:11.5px;color:var(--muted);font-weight:600;}
  .lock-btn{
    margin-left:auto;
    width:29px;height:29px;
    border-radius:8px;
    border:1.5px solid #e6e9f2;
    background:#fafbff;
    cursor:pointer;
    font-size:12.5px;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:.18s;
    padding:0;
  }
  .lock-btn:hover{background:#eef0fb;border-color:#c7d2fe;}
  .card.locked .lock-btn{background:#eef0ff;border-color:#c7d2fe;}
  .bar{
    height:6px;background:#eef1f8;border-radius:99px;overflow:hidden;margin-top:10px;
  }
  .bar-fill{
    height:100%;width:0;border-radius:99px;
    transition:width .4s cubic-bezier(.4,0,.2,1),background .3s;
    background:linear-gradient(90deg,#8b5cf6,#6366f1);
  }
  .card-foot{
    display:flex;justify-content:space-between;
    margin-top:7px;
    font-size:10.5px;color:var(--muted);font-weight:600;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- 底部说明 ---------- */
  .tips{
    margin-top:14px;
    background:#fff;
    border:1px dashed #dfe3f2;
    border-radius:12px;
    padding:11px 15px;
    font-size:11.5px;
    line-height:1.85;
    color:var(--muted);
  }
  .tips b{color:#4f46e5;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    left:50%;bottom:30px;
    transform:translate(-50%,16px);
    background:#1b2030;
    color:#fff;
    font-size:13px;
    font-weight:500;
    padding:10px 20px;
    border-radius:11px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    box-shadow:0 10px 26px rgba(0,0,0,.24);
    z-index:99;
    max-width:86vw;
    text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* ---------- 响应式 ---------- */
  @media (max-width:640px){
    .subjects.cols-2{grid-template-columns:minmax(0,1fr);}
  }
  @media (max-width:560px){
    .panel{padding:12px;}
    .field{flex:1 1 100%;}
    .field input{width:100%;}
    .field .dropdown{min-width:100%;width:100%;}
    .btn{flex:1 1 auto;}
    .hero h1{font-size:19px;}
    .sum-val{font-size:19px;}
    .total-tip{font-size:10px;padding:3px 8px;right:6px;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="hero">
    <h1>考研分数拆解工具</h1>
    <p>输入目标总分 · 生成各科分数 · 改动一科，其余自动重分配</p>
  </header>

  <section class="panel">
    <div class="field">
      <div class="field-label-row">
        <label>目标总分</label>
        <div class="quick-chips" id="quickChips"></div>
      </div>
      <input id="totalInput" type="number" min="0" step="1" value="380">
    </div>
    <div class="field">
      <label>科目组合</label>
      <div class="dropdown" id="templateDropdown">
        <button type="button" class="dropdown-trigger" id="dropdownTrigger"
                aria-haspopup="listbox" aria-expanded="false">
          <span id="dropdownLabel"></span>
          <svg class="dropdown-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="dropdown-menu" id="dropdownMenu" role="listbox" aria-label="科目组合"></div>
      </div>
    </div>
    <button class="btn btn-primary" id="generateBtn">随机生成</button>
    <button class="btn btn-ghost" id="unlockBtn">全部解锁</button>
    <button class="btn btn-export" id="exportBtn">导出图片</button>
  </section>

  <section class="summary">
    <div class="sum-block total">
      <div class="sum-label">目标总分</div>
      <div class="sum-val" id="sumTotal">380</div>
      <span class="total-tip" id="totalTip">各科总和低于总分，请更改</span>
    </div>
    <div class="sum-block rate">
      <div class="sum-label">整体得分率</div>
      <div class="sum-val" id="sumRate">76.0%</div>
    </div>
  </section>

  <div class="diff-bar" id="diffBar" hidden>
    <span id="diffText"></span>
    <button type="button" class="diff-fix" id="autoFixBtn">自动补齐</button>
  </div>

  <section class="subjects" id="subjects"></section>

  <footer class="tips">
    <div>• <b>双击科目名称</b>即可重命名（回车确认，Esc 取消）。</div>
    <div>• 修改任意一科分数后，该科会被 <b>锁定</b>，剩余总分按各科现有比例自动分配给未锁定的科目；若分不完，上方会出现偏差提示，点「自动补齐」即可拉回总分。</div>
    <div>• 点击科目右侧的 🔒 可解锁，解锁后该科会参与下一次的重新分配。</div>
    <div>• 专业课分值按科目数量区分：<b>1 门</b>为 150 分或 300 分，<b>2 门</b>则各 150 分。</div>
    <div>• 「导出图片」会生成一张干净的 PNG，可直接保存或分享。</div>
  </footer>

</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   科目模板
   ========================================================= */
const TEMPLATES = {
  math: {
    label: '考数学：政治 + 外语 + 数学 + 专业课',
    defaultTotal: 500,
    subjects: [
      { name: '思想政治理论', full: 100, min: 0.52, max: 0.85 },
      { name: '外国语',       full: 100, min: 0.42, max: 0.85 },
      { name: '数学',         full: 150, min: 0.35, max: 0.92 },
      { name: '专业课',       full: 150, min: 0.50, max: 0.95 }
    ]
  },
  two: {
    label: '两门专业课：政治 + 外语 + 专业课一 + 专业课二',
    defaultTotal: 500,
    subjects: [
      { name: '思想政治理论', full: 100, min: 0.52, max: 0.85 },
      { name: '外国语',       full: 100, min: 0.42, max: 0.85 },
      { name: '专业课一',     full: 150, min: 0.50, max: 0.95 },
      { name: '专业课二',     full: 150, min: 0.50, max: 0.95 }
    ]
  },
  one300: {
    label: '单门300分：政治 + 外语 + 专业课（统考类）',
    defaultTotal: 500,
    subjects: [
      { name: '思想政治理论', full: 100, min: 0.52, max: 0.85 },
      { name: '外国语',       full: 100, min: 0.42, max: 0.85 },
      { name: '专业课（300分）', full: 300, min: 0.50, max: 0.92 }
    ]
  },
  mgmt: {
    label: '管理类联考：管综 + 外语（总分300）',
    defaultTotal: 300,
    subjects: [
      { name: '管理类综合能力', full: 200, min: 0.50, max: 0.90 },
      { name: '外国语',         full: 100, min: 0.45, max: 0.88 }
    ]
  }
};

/* =========================================================
   状态
   ========================================================= */
const state = {
  template: 'math',
  total: 380,
  subjects: []
};
let els = [];
let lastLowState = false;
let totalTipTimer = null;

/* =========================================================
   工具函数
   ========================================================= */
function rateColor(rate){
  const r = Math.max(0, Math.min(1, rate));
  const hue = Math.round(r * 125);
  return `linear-gradient(90deg, hsl(${hue} 78% 62%), hsl(${hue} 78% 50%))`;
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function showTotalTip(){
  const tip = document.getElementById('totalTip');
  if (!tip) return;
  tip.classList.add('show');
  clearTimeout(totalTipTimer);
  totalTipTimer = setTimeout(() => tip.classList.remove('show'), 1500);
}

/* =========================================================
   分配算法
   ========================================================= */
function distribute(total, fulls, weights){
  const n = fulls.length;
  const vals = new Array(n).fill(0);
  let rem = total;
  let active = [];
  for (let i = 0; i < n; i++) active.push(i);

  let guard = 0;
  while (rem > 1e-9 && active.length && guard++ < 200){
    let wsum = 0;
    for (const i of active) wsum += weights[i];
    if (wsum <= 0) break;

    const nextActive = [];
    let used = 0;
    for (const i of active){
      const add = rem * weights[i] / wsum;
      const room = fulls[i] - vals[i];
      if (add >= room - 1e-9){
        vals[i] = fulls[i];
        used += room;
      } else {
        vals[i] += add;
        used += add;
        nextActive.push(i);
      }
    }
    rem -= used;
    if (rem < 0) rem = 0;
    if (nextActive.length === active.length) break;
    active = nextActive;
  }

  for (let i = 0; i < n; i++) vals[i] = Math.round(vals[i]);
  let diff = Math.round(total) - vals.reduce((a, b) => a + b, 0);
  let g2 = 0;
  while (diff !== 0 && g2++ < 6000){
    let changed = false;
    for (let i = 0; i < n && diff !== 0; i++){
      if (diff > 0 && vals[i] < fulls[i]){ vals[i]++; diff--; changed = true; }
      else if (diff < 0 && vals[i] > 0){ vals[i]--; diff++; changed = true; }
    }
    if (!changed) break;
  }
  return vals;
}

/* =========================================================
   科目构建 / 渲染
   ========================================================= */
function buildSubjects(){
  const tpl = TEMPLATES[state.template];
  state.subjects = tpl.subjects.map(s => ({
    name: s.name, full: s.full, min: s.min, max: s.max,
    value: 0, locked: false
  }));
}

function startRename(i, nameEl){
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'rename-input';
  input.value = state.subjects[i].name;
  input.maxLength = 24;
  nameEl.replaceWith(input);
  input.focus();
  input.select();

  const finish = (commit) => {
    if (!input.isConnected) return;
    const val = input.value.trim();
    if (commit && val) state.subjects[i].name = val;
    nameEl.textContent = state.subjects[i].name;
    input.replaceWith(nameEl);
  };

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); finish(true); }
    else if (e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

function renderSubjects(){
  const wrap = document.getElementById('subjects');
  const n = state.subjects.length;

  wrap.className = 'subjects' + ((n === 4 || n === 2) ? ' cols-2' : '');
  wrap.innerHTML = '';
  els = [];

  state.subjects.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'card';

    const top = document.createElement('div');
    top.className = 'card-top';
    const nameEl = document.createElement('span');
    nameEl.className = 'card-name';
    nameEl.textContent = s.name;
    nameEl.title = '双击可重命名';
    const fullEl = document.createElement('span');
    fullEl.className = 'card-full';
    fullEl.textContent = '满分 ' + s.full;
    top.append(nameEl, fullEl);

    const mid = document.createElement('div');
    mid.className = 'card-mid';
    const input = document.createElement('input');
    input.type = 'number';
    input.className = 'score-input';
    input.min = 0;
    input.max = s.full;
    input.step = 1;
    const unit = document.createElement('span');
    unit.className = 'unit';
    unit.textContent = '分';
    const lock = document.createElement('button');
    lock.type = 'button';
    lock.className = 'lock-btn';
    mid.append(input, unit, lock);

    const bar = document.createElement('div');
    bar.className = 'bar';
    const fill = document.createElement('div');
    fill.className = 'bar-fill';
    bar.appendChild(fill);

    const foot = document.createElement('div');
    foot.className = 'card-foot';
    const rateEl = document.createElement('span');
    const deltaEl = document.createElement('span');
    foot.append(rateEl, deltaEl);

    card.append(top, mid, bar, foot);
    wrap.appendChild(card);

    input.addEventListener('input', () => handleInput(i, input.value));
    input.addEventListener('blur', () => {
      if (input.value === '' || isNaN(Number(input.value))){
        input.value = state.subjects[i].value;
      }
    });
    lock.addEventListener('click', () => toggleLock(i));
    nameEl.addEventListener('dblclick', () => startRename(i, nameEl));

    els.push({ card, input, fill, rate: rateEl, delta: deltaEl, lock });
  });
}

function updateUI(){
  state.subjects.forEach((s, i) => {
    const e = els[i];
    if (!e) return;
    if (document.activeElement !== e.input) e.input.value = s.value;

    const rate = s.full ? s.value / s.full : 0;
    e.fill.style.width = Math.min(rate * 100, 100) + '%';
    e.fill.style.background = rateColor(rate);
    e.rate.textContent = '得分率 ' + (rate * 100).toFixed(1) + '%';
    e.delta.textContent = '距满分 ' + (s.full - s.value) + ' 分';

    e.card.classList.toggle('locked', s.locked);
    e.lock.textContent = s.locked ? '🔒' : '🔓';
    e.lock.title = s.locked ? '点击解锁' : '点击锁定';
  });

  const sum = state.subjects.reduce((a, s) => a + s.value, 0);
  const fullSum = state.subjects.reduce((a, s) => a + s.full, 0);
  document.getElementById('sumTotal').textContent = state.total;
  document.getElementById('sumRate').textContent =
    fullSum ? ((sum / fullSum) * 100).toFixed(1) + '%' : '0%';

  // 偏差提示条
  const diff = state.total - sum;
  const bar = document.getElementById('diffBar');
  const txt = document.getElementById('diffText');
  if (diff === 0){
    bar.hidden = true;
  } else {
    bar.hidden = false;
    bar.classList.toggle('over', diff < 0);
    bar.classList.toggle('under', diff > 0);
    txt.textContent = diff < 0
      ? '当前合计比目标总分多 ' + (-diff) + ' 分'
      : '当前合计比目标总分少 ' + diff + ' 分';
  }

  // 总和低于总分 → 总分上方冒小标签，1.5 秒后消失
  const isLow = sum < state.total;
  if (isLow && !lastLowState) showTotalTip();
  lastLowState = isLow;

  syncChips();
}

/* =========================================================
   随机生成
   ========================================================= */
function generateScores(){
  const subs = state.subjects;
  const fullSum = subs.reduce((a, s) => a + s.full, 0);
  const total = Math.min(state.total, fullSum);
  const targetRate = fullSum ? total / fullSum : 0;

  let vals = subs.map(s => {
    const noise = (Math.random() - 0.5) * 0.20;
    let r = targetRate + noise;
    r = Math.min(Math.max(r, s.min), s.max);
    return r * s.full;
  });

  for (let k = 0; k < 600; k++){
    const S = vals.reduce((a, b) => a + b, 0);
    const diff = total - S;
    if (Math.abs(diff) < 0.01) break;

    const idxs = [];
    for (let i = 0; i < vals.length; i++){
      if (diff > 0){
        if (vals[i] < subs[i].full - 1e-9) idxs.push(i);
      } else {
        if (vals[i] > 1e-9) idxs.push(i);
      }
    }
    if (!idxs.length) break;

    const caps = idxs.map(i => diff > 0 ? subs[i].full - vals[i] : vals[i]);
    const capSum = caps.reduce((a, b) => a + b, 0);
    const step = Math.min(Math.abs(diff), capSum);
    const sign = Math.sign(diff);
    idxs.forEach((i, j) => { vals[i] += sign * step * caps[j] / capSum; });
  }

  vals = vals.map(v => Math.round(v));
  let d = Math.round(total) - vals.reduce((a, b) => a + b, 0);
  let guard = 0;
  while (d !== 0 && guard++ < 6000){
    let changed = false;
    for (let i = 0; i < vals.length && d !== 0; i++){
      if (d > 0 && vals[i] < subs[i].full){ vals[i]++; d--; changed = true; }
      else if (d < 0 && vals[i] > 0){ vals[i]--; d++; changed = true; }
    }
    if (!changed) break;
  }

  subs.forEach((s, i) => { s.value = vals[i]; s.locked = false; });

  const realSum = subs.reduce((a, s) => a + s.value, 0);
  if (realSum !== state.total){
    toast('目标总分超出该组合的合理范围，已按上限生成');
  }
}

/* =========================================================
   重新分配
   ========================================================= */
function redistributeAll(){
  const lockedSum = state.subjects
    .filter(s => s.locked)
    .reduce((a, s) => a + s.value, 0);

  const freeIdx = [];
  state.subjects.forEach((s, i) => { if (!s.locked) freeIdx.push(i); });
  if (!freeIdx.length) return true;

  const rem = state.total - lockedSum;
  const freeFull = freeIdx.reduce((a, i) => a + state.subjects[i].full, 0);
  if (rem < 0 || rem > freeFull) return false;

  const weights = freeIdx.map(i =>
    Math.max(state.subjects[i].value, state.subjects[i].full * 0.25)
  );
  const fulls = freeIdx.map(i => state.subjects[i].full);
  const vals = distribute(rem, fulls, weights);
  freeIdx.forEach((i, k) => { state.subjects[i].value = vals[k]; });
  return true;
}

/* =========================================================
   手改某科（允许偏差）
   ========================================================= */
function handleInput(i, raw){
  const s = state.subjects[i];
  if (raw === '' || raw === null) return;

  let v = Number(raw);
  if (!isFinite(v)) return;
  v = Math.round(v);
  if (v < 0) v = 0;
  if (v > s.full) v = s.full;

  s.value = v;
  s.locked = true;

  let lockedSum = 0;
  state.subjects.forEach((x, j) => {
    if (j !== i && x.locked) lockedSum += x.value;
  });

  const rem = state.total - lockedSum - v;

  const freeIdx = [];
  state.subjects.forEach((x, j) => {
    if (j !== i && !x.locked) freeIdx.push(j);
  });
  const freeFull = freeIdx.reduce((a, j) => a + state.subjects[j].full, 0);

  if (freeIdx.length){
    const actual = Math.max(0, Math.min(rem, freeFull));
    const weights = freeIdx.map(j =>
      Math.max(state.subjects[j].value, state.subjects[j].full * 0.25)
    );
    const fulls = freeIdx.map(j => state.subjects[j].full);
    const vals = distribute(actual, fulls, weights);
    freeIdx.forEach((j, k) => { state.subjects[j].value = vals[k]; });
  }

  updateUI();
}

/* =========================================================
   自动补齐
   ========================================================= */
function autoFix(){
  const sum = state.subjects.reduce((a, s) => a + s.value, 0);
  const diff = state.total - sum;
  if (diff === 0){ toast('分数已与目标总分一致'); return; }

  const freeIdx = [];
  state.subjects.forEach((s, i) => { if (!s.locked) freeIdx.push(i); });

  if (freeIdx.length){
    const freeSum = freeIdx.reduce((a, i) => a + state.subjects[i].value, 0);
    const freeFull = freeIdx.reduce((a, i) => a + state.subjects[i].full, 0);
    const newFreeSum = freeSum + diff;
    if (newFreeSum >= 0 && newFreeSum <= freeFull){
      const weights = freeIdx.map(i =>
        Math.max(state.subjects[i].value, state.subjects[i].full * 0.25)
      );
      const fulls = freeIdx.map(i => state.subjects[i].full);
      const vals = distribute(newFreeSum, fulls, weights);
      freeIdx.forEach((i, k) => { state.subjects[i].value = vals[k]; });
      updateUI();
      toast('已用未锁定科目自动补齐');
      return;
    }
  }

  state.subjects.forEach(s => { s.locked = false; });
  const fulls = state.subjects.map(s => s.full);
  const weights = state.subjects.map(s => Math.max(s.value, s.full * 0.25));
  const vals = distribute(state.total, fulls, weights);
  state.subjects.forEach((s, i) => { s.value = vals[i]; });
  updateUI();
  toast('已重新分配全部科目以匹配总分');
}

/* =========================================================
   锁定 / 解锁
   ========================================================= */
function toggleLock(i){
  const s = state.subjects[i];
  if (s.locked){
    s.locked = false;
    const ok = redistributeAll();
    if (!ok){
      s.locked = true;
      toast('解锁后剩余分数无法分配，请先调整其他科目');
    }
  } else {
    s.locked = true;
  }
  updateUI();
}

/* =========================================================
   快捷总分 chips
   ========================================================= */
function renderChips(){
  const wrap = document.getElementById('quickChips');
  if (!wrap) return;
  const tpl = TEMPLATES[state.template];
  const fullSum = tpl.subjects.reduce((a, s) => a + s.full, 0);
  let vals;
  if (fullSum <= 300){
    vals = [250, 270, 290];
  } else if (fullSum >= 500){
    vals = [360, 380, 400, 420];
  } else {
    vals = [fullSum - 60, fullSum - 30, fullSum];
  }
  wrap.innerHTML = '';
  vals.forEach(v => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.dataset.val = String(v);
    b.textContent = String(v);
    b.addEventListener('click', () => {
      const totalInput = document.getElementById('totalInput');
      totalInput.value = v;
      totalInput.dispatchEvent(new Event('change'));
    });
    wrap.appendChild(b);
  });
  syncChips();
}

function syncChips(){
  const v = String(state.total);
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.dataset.val === v);
  });
}

/* =========================================================
   导出图片
   ========================================================= */
function pathRoundRect(ctx, x, y, w, h, r){
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function exportImage(){
  try {
    const n = state.subjects.length;
    const cols = (n === 4 || n === 2) ? 2 : n;
    const rows = Math.ceil(n / cols);

    const W = 820;
    const padX = 30, padTop = 26, padBottom = 26;
    const titleH = 46;
    const summaryH = 62;
    const gapY = 12;
    const cardH = 108;
    const cardGap = 12;
    const FONT = '"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif';

    const contentW = W - padX * 2;
    const cardW = cols === 2 ? (contentW - cardGap) / 2 : contentW;
    const contentH = titleH + gapY + summaryH + gapY + rows * cardH + (rows - 1) * cardGap;
    const H = padTop + contentH + padBottom;

    const dpr = 2;
    const canvas = document.createElement('canvas');
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const bgGrad = ctx.createLinearGradient(0, 0, W, H);
    bgGrad.addColorStop(0, '#f4f5fc');
    bgGrad.addColorStop(1, '#f1eefb');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    let y = padTop;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font = '700 23px ' + FONT;
    const tg = ctx.createLinearGradient(W/2 - 150, 0, W/2 + 150, 0);
    tg.addColorStop(0, '#4f46e5');
    tg.addColorStop(.6, '#8b5cf6');
    tg.addColorStop(1, '#d946ef');
    ctx.fillStyle = tg;
    ctx.fillText('考研目标分数拆解', W/2, y + 30);
    y += titleH + gapY;

    const sum = state.subjects.reduce((a, s) => a + s.value, 0);
    const fullSum = state.subjects.reduce((a, s) => a + s.full, 0);
    const rate = fullSum ? sum / fullSum : 0;
    const sumW = (contentW - cardGap) / 2;

    function drawSumBlock(x, yy, w, h, label, val, valColor, c1, c2){
      pathRoundRect(ctx, x, yy, w, h, 13);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#e6e9f2';
      ctx.lineWidth = 1;
      ctx.stroke();

      const g = ctx.createLinearGradient(0, yy, 0, yy + h);
      g.addColorStop(0, c1);
      g.addColorStop(1, c2);
      ctx.fillStyle = g;
      pathRoundRect(ctx, x, yy + 11, 4, h - 22, 2);
      ctx.fill();

      ctx.textAlign = 'left';
      ctx.font = '600 11.5px ' + FONT;
      ctx.fillStyle = '#6c7488';
      ctx.fillText(label, x + 18, yy + 22);

      ctx.font = '800 22px ' + FONT;
      ctx.fillStyle = valColor;
      ctx.fillText(val, x + 18, yy + h - 14);
    }

    drawSumBlock(padX, y, sumW, summaryH, '目标总分', String(state.total), '#4f46e5', '#818cf8', '#6366f1');
    drawSumBlock(padX + sumW + cardGap, y, sumW, summaryH, '整体得分率',
                 (rate * 100).toFixed(1) + '%', '#0ea5a5', '#34d399', '#0ea5a5');
    y += summaryH + gapY;

    function drawCard(x, yy, w, h, s){
      const locked = s.locked;
      pathRoundRect(ctx, x, yy, w, h, 13);
      ctx.fillStyle = locked ? '#f8f9ff' : '#ffffff';
      ctx.fill();
      ctx.strokeStyle = locked ? '#c7d2fe' : '#e6e9f2';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      const p = 15;

      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.font = '700 14px ' + FONT;
      ctx.fillStyle = '#1b2030';
      let name = s.name;
      const maxNameW = w - p * 2 - 58;
      while (ctx.measureText(name).width > maxNameW && name.length > 1){
        name = name.slice(0, -1);
      }
      if (name !== s.name) name = name.slice(0, -1) + '…';
      ctx.fillText(name, x + p, yy + 26);

      ctx.textAlign = 'right';
      ctx.font = '600 11px ' + FONT;
      ctx.fillStyle = '#6c7488';
      ctx.fillText('满分 ' + s.full, x + w - p, yy + 26);

      const r = s.full ? s.value / s.full : 0;
      const valStr = String(s.value);
      ctx.textAlign = 'left';
      ctx.font = '800 26px ' + FONT;
      ctx.fillStyle = '#4f46e5';
      ctx.fillText(valStr, x + p, yy + 62);
      const scoreW = ctx.measureText(valStr).width;
      ctx.font = '600 11.5px ' + FONT;
      ctx.fillStyle = '#6c7488';
      ctx.fillText('分', x + p + scoreW + 5, yy + 62);

      const barY = yy + 76, barH = 6, barW = w - p * 2;
      pathRoundRect(ctx, x + p, barY, barW, barH, 3);
      ctx.fillStyle = '#eef1f8';
      ctx.fill();

      const hue = Math.round(Math.max(0, Math.min(1, r)) * 125);
      const fw = barW * Math.min(r, 1);
      if (fw > 0.5){
        pathRoundRect(ctx, x + p, barY, fw, barH, 3);
        const fg = ctx.createLinearGradient(x + p, 0, x + p + fw, 0);
        fg.addColorStop(0, 'hsl(' + hue + ' 78% 62%)');
        fg.addColorStop(1, 'hsl(' + hue + ' 78% 50%)');
        ctx.fillStyle = fg;
        ctx.fill();
      }

      ctx.font = '600 10.5px ' + FONT;
      ctx.fillStyle = '#6c7488';
      ctx.textAlign = 'left';
      ctx.fillText('得分率 ' + (r * 100).toFixed(1) + '%', x + p, yy + h - 12);
      ctx.textAlign = 'right';
      ctx.fillText('距满分 ' + (s.full - s.value) + ' 分', x + w - p, yy + h - 12);
    }

    state.subjects.forEach((s, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const cx = padX + col * (cardW + cardGap);
      const cy = y + row * (cardH + cardGap);
      drawCard(cx, cy, cardW, cardH, s);
    });

    canvas.toBlob(blob => {
      if (!blob){
        toast('导出失败，请重试');
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const d = new Date();
      const stamp = d.getFullYear()
        + String(d.getMonth() + 1).padStart(2, '0')
        + String(d.getDate()).padStart(2, '0');
      a.download = '考研分数拆解_' + state.total + '分_' + stamp + '.png';
      a.href = url;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      toast('图片已导出');
    }, 'image/png');
  } catch (err){
    console.error(err);
    toast('导出失败，请重试');
  }
}

/* =========================================================
   自定义下拉
   ========================================================= */
const dropdown = document.getElementById('templateDropdown');
const trigger = document.getElementById('dropdownTrigger');
const menu = document.getElementById('dropdownMenu');
const labelEl = document.getElementById('dropdownLabel');

function buildDropdown(){
  menu.innerHTML = '';
  Object.keys(TEMPLATES).forEach(k => {
    const opt = document.createElement('div');
    opt.className = 'dropdown-option' + (k === state.template ? ' active' : '');
    opt.dataset.key = k;
    opt.tabIndex = -1;
    opt.setAttribute('role', 'option');
    opt.setAttribute('aria-selected', String(k === state.template));
    const dot = document.createElement('span');
    dot.className = 'dot';
    const txt = document.createElement('span');
    txt.textContent = TEMPLATES[k].label;
    opt.append(dot, txt);
    opt.addEventListener('click', () => selectTemplate(k));
    menu.appendChild(opt);
  });
  labelEl.textContent = TEMPLATES[state.template].label;
}

function openDropdown(){
  dropdown.classList.add('open');
  trigger.setAttribute('aria-expanded', 'true');
  const active = menu.querySelector('.dropdown-option.active') || menu.firstElementChild;
  if (active) active.focus();
}

function closeDropdown(){
  dropdown.classList.remove('open');
  trigger.setAttribute('aria-expanded', 'false');
}

function toggleDropdown(){
  dropdown.classList.contains('open') ? closeDropdown() : openDropdown();
}

function selectTemplate(key){
  closeDropdown();
  if (key === state.template) return;

  state.template = key;
  state.total = TEMPLATES[key].defaultTotal;
  document.getElementById('totalInput').value = state.total;

  buildSubjects();
  renderSubjects();
  generateScores();
  updateUI();
  renderChips();

  labelEl.textContent = TEMPLATES[key].label;
  menu.querySelectorAll('.dropdown-option').forEach(o => {
    const on = o.dataset.key === key;
    o.classList.toggle('active', on);
    o.setAttribute('aria-selected', String(on));
  });
}

/* =========================================================
   初始化
   ========================================================= */
function init(){
  buildDropdown();

  trigger.addEventListener('click', e => {
    e.stopPropagation();
    toggleDropdown();
  });
  trigger.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      openDropdown();
    }
  });

  document.addEventListener('click', e => {
    if (!dropdown.contains(e.target)) closeDropdown();
  });

  menu.addEventListener('keydown', e => {
    const opts = Array.from(menu.querySelectorAll('.dropdown-option'));
    const idx = opts.indexOf(document.activeElement);
    if (e.key === 'ArrowDown'){
      e.preventDefault();
      opts[(idx + 1) % opts.length]?.focus();
    } else if (e.key === 'ArrowUp'){
      e.preventDefault();
      opts[(idx - 1 + opts.length) % opts.length]?.focus();
    } else if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      if (document.activeElement.classList.contains('dropdown-option')){
        selectTemplate(document.activeElement.dataset.key);
      }
    } else if (e.key === 'Escape'){
      closeDropdown();
      trigger.focus();
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDropdown();
  });

  const totalInput = document.getElementById('totalInput');
  totalInput.value = state.total;

  totalInput.addEventListener('change', () => {
    const fullSum = state.subjects.reduce((a, s) => a + s.full, 0);
    let v = Math.round(Number(totalInput.value));
    if (!isFinite(v) || v < 0) v = 0;
    if (v > fullSum){
      v = fullSum;
      toast('该科目组合满分为 ' + fullSum + ' 分');
    }
    state.total = v;
    totalInput.value = v;
    generateScores();
    updateUI();
    syncChips();
  });

  document.getElementById('generateBtn').addEventListener('click', () => {
    generateScores();
    updateUI();
  });

  document.getElementById('unlockBtn').addEventListener('click', () => {
    state.subjects.forEach(s => { s.locked = false; });
    redistributeAll();
    updateUI();
    toast('已解锁全部科目，并重新分配分数');
  });

  document.getElementById('autoFixBtn').addEventListener('click', autoFix);

  document.getElementById('exportBtn').addEventListener('click', exportImage);

  buildSubjects();
  renderSubjects();
  generateScores();
  updateUI();
  renderChips();
}

init();
</script>
</body>
</html>
